name: M13 P1-C Linux Admission (Controlled)

on:
  workflow_dispatch:
    inputs:
      admission_mode:
        description: Separately approved mode; discovery never starts the application
        required: true
        type: choice
        options:
          - ARTIFACT_DISCOVERY
          - QUALIFIED_WORKLOAD
        default: ARTIFACT_DISCOVERY
      approved_manifest_url:
        description: Public project release JSON approved separately for this exact mode
        required: true
        type: string
      approved_manifest_sha256:
        description: Independently approved SHA-256 of the exact V2 plan
        required: true
        type: string
      retention_policy_confirmed:
        description: CLASSIC3 has verified repository policy permits 14 days
        required: true
        type: boolean
        default: false
      workload_authorized:
        description: Separate CLASSIC3 authorization for the exact workload binding
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: m13-p1-c-linux-qualification
  cancel-in-progress: false

jobs:
  qualification:
    if: github.repository == 'TommyGiacopini/piccadilly-booking' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      ADMISSION_MODE: ${{ inputs.admission_mode }}
      APPROVED_MANIFEST_URL: ${{ inputs.approved_manifest_url }}
      APPROVED_MANIFEST_SHA256: ${{ inputs.approved_manifest_sha256 }}
      P1C_RETENTION_CONFIRMED: ${{ inputs.retention_policy_confirmed }}
      P1C_WORKLOAD_AUTHORIZED: ${{ inputs.workload_authorized }}
    steps:
      - name: Establish global clock and resource admission
        timeout-minutes: 1
        run: |
          set -euo pipefail
          read -r started _ < /proc/uptime
          export P1C_STARTED_UPTIME_SECONDS="$started"
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVED_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$ADMISSION_MODE" == ARTIFACT_DISCOVERY || "$ADMISSION_MODE" == QUALIFIED_WORKLOAD ]]
          [[ "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          task_dir="$(mktemp -d "$RUNNER_TEMP/p1c-admission.XXXXXXXX")"
          printf 'P1C_TASK_DIRECTORY=%s\nP1C_SANITIZED_DIRECTORY=%s/sanitized\n' "$task_dir" "$task_dir" >> "$GITHUB_ENV"
          node --input-type=module -e '
            import {readFileSync, appendFileSync, statfsSync} from "node:fs";
            import {availableParallelism} from "node:os";
            const availableMiB=Number(/^MemAvailable:\s+(\d+) kB$/m.exec(readFileSync("/proc/meminfo","utf8"))?.[1])/1024;
            const started=Number(process.env.P1C_STARTED_UPTIME_SECONDS)*1000;
            if(!Number.isFinite(started)||started<=0||availableParallelism()<4||availableMiB<3840) throw Error("RESOURCE_ADMISSION_FAILED");
            appendFileSync(process.env.GITHUB_ENV,`P1C_JOB_STARTED_UPTIME_MS=${started}\n`);
            const disk=statfsSync(process.env.RUNNER_TEMP);
            console.log(JSON.stringify({cpu:availableParallelism(),availableMiB,availableDiskBytes:disk.bavail*disk.bsize,
              hardLimitsMiB:2816,reserveMiB:1024,admissionMiB:3840,workloadPeak:"NOT_QUALIFIED"}));
          '

      - name: Retrieve only the dispatched public revision
        timeout-minutes: 1
        run: |
          set -euo pipefail
          source_dir="$P1C_TASK_DIRECTORY/source"
          git init --quiet "$source_dir"
          git -C "$source_dir" config core.autocrlf false
          git -C "$source_dir" remote add origin https://github.com/TommyGiacopini/piccadilly-booking.git
          git -C "$source_dir" -c credential.helper= fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "$source_dir" rev-parse HEAD)" == "$GITHUB_SHA" ]]
          source_tree="$(git -C "$source_dir" rev-parse 'HEAD^{tree}')"
          [[ "$source_tree" =~ ^[a-f0-9]{40}$ ]]
          printf 'P1C_SOURCE_TREE=%s\n' "$source_tree" >> "$GITHUB_ENV"
          git -C "$source_dir" ls-files -z > "$P1C_TASK_DIRECTORY/source-files.bin"

      - name: Execute only the separately authorized admission mode
        id: admission
        # ceil(1525s / 60) = 26: a nonnegative step offset cannot preempt
        # T0+1525s. Absolute phase deadlines still reserve 120s + 155s.
        timeout-minutes: 26
        working-directory: ${{ env.P1C_TASK_DIRECTORY }}/source
        run: |
          set -euo pipefail
          node scripts/m13-p1-worker-linux-image.mjs --admission-job \
            "$ADMISSION_MODE" "$APPROVED_MANIFEST_URL" "$APPROVED_MANIFEST_SHA256" \
            "$P1C_TASK_DIRECTORY/source-files.bin" "$P1C_TASK_DIRECTORY/raw" "$P1C_SANITIZED_DIRECTORY"

      - name: Finalize only closed-schema sanitized evidence
        id: package
        if: always()
        timeout-minutes: 1
        working-directory: ${{ env.P1C_TASK_DIRECTORY }}/source
        run: |
          set -euo pipefail
          node scripts/m13-p1-worker-linux-image.mjs --finalize-evidence \
            "$P1C_SANITIZED_DIRECTORY" \
            "$P1C_TASK_DIRECTORY/p1c-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"

      # Proposed concrete pin, verified as actions/upload-artifact v7 at D3.
      # This new execution dependency still requires independent WORK3 QG.
      - name: Retain the single sanitized archive
        id: upload
        if: always() && steps.package.outcome == 'success' && env.P1C_UPLOAD_FILE != ''
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ env.P1C_UPLOAD_FILE }}
          archive: false
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false

      - name: Record retention outcome without replacing primary failure
        if: always()
        timeout-minutes: 1
        env:
          RETENTION_STEP_OUTCOME: ${{ steps.upload.outcome }}
          RETENTION_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          RETENTION_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RETENTION_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import {readFileSync,existsSync} from "node:fs";
            const path=process.env.P1C_SANITIZED_DIRECTORY+"/outcome.json";
            const result=existsSync(path)?JSON.parse(readFileSync(path,"utf8")):null;
            import {pathToFileURL} from "node:url";
            const {linuxRetentionResult}=await import(pathToFileURL(process.env.P1C_TASK_DIRECTORY+"/source/scripts/m13-p1-worker-linux-image.mjs").href);
            const summary=linuxRetentionResult(result,{step:process.env.RETENTION_STEP_OUTCOME,id:process.env.RETENTION_ARTIFACT_ID,
              url:process.env.RETENTION_ARTIFACT_URL,sha256:process.env.RETENTION_ARTIFACT_DIGEST,archiveSha256:process.env.P1C_ARCHIVE_SHA256});
            console.log(JSON.stringify(summary));
            if(!summary.complete) process.exitCode=2;
          '
