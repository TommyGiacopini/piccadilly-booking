previews:
  generation: off

services:
  - type: web
    name: piccadilly-booking-m13-61a66b11-web
    runtime: node
    branch: main
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci && npm run db:generate && npm run build
    preDeployCommand: npm run staging:validate:web && npm run db:migrate:deploy && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: piccadilly-booking-m13-61a66b11-db
          property: connectionString
      - key: AUTH_RESTAURANT_ID
        value: 00000000-0000-4000-8000-000000000001
      - key: AUTH_TRUST_PROXY
        value: "true"
      - key: AUTH_RATE_LIMIT_SECRET
        generateValue: true
      - key: PUBLIC_BOOKING_MANAGEMENT_SECRET
        generateValue: true
      - key: PUBLIC_BOOKING_RATE_LIMIT_SECRET
        generateValue: true
      - key: PUBLIC_BOOKING_RATE_LIMIT_WINDOW_SECONDS
        value: "900"
      - key: PUBLIC_BOOKING_READ_LIMIT
        value: "60"
      - key: PUBLIC_BOOKING_MUTATION_LIMIT
        value: "10"
      - key: RESERVATION_PRIVACY_POLICY_VERSION
        value: staging-demo-v1
      - key: RESERVATION_TERMS_VERSION
        value: staging-demo-terms-v1
      - key: RESERVATION_IDEMPOTENCY_TTL_HOURS
        value: "24"
      - key: STAGING_ACCESS_USERNAME
        value: piccadilly-staging
      - key: STAGING_ACCESS_PASSWORD
        sync: false
      - key: AUTH_DEMO_ADMIN_PASSWORD
        sync: false
      - key: AUTH_DEMO_STAFF_PASSWORD
        sync: false

  - type: worker
    name: piccadilly-booking-m13-61a66b11-worker
    runtime: node
    branch: main
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci && npm run db:generate && npm run typecheck
    startCommand: npm run notifications:worker:staging
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: piccadilly-booking-m13-61a66b11-db
          property: connectionString

databases:
  - name: piccadilly-booking-m13-61a66b11-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    postgresMajorVersion: "18"
    databaseName: piccadilly_booking_staging
    user: piccadilly_staging
    connectionPool: none
    ipAllowList: []
